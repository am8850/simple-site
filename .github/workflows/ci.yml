name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'infrastructure/**'

  pull_request:
    paths-ignore:
      - 'infrastructure/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Astro checks
        run: npm run check

      - name: Build site
        run: npm run build